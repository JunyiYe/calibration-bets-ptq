[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-bets-ptq"
version = "1.0.0"
description = "Post-training quantization of financial time-series forecasters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
